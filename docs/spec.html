<title>Brxswer Interface Spec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* layout: state tree rail | live window on a stage | spec grid under it.
   Tokens are the Orrery palettes; JS swaps them when the theme changes. */
:root {
  --b0: #0a0a0a; --b1: #141414; --b2: #1e1e1e; --b3: #282828; --b4: #333333;
  --fg: #e8e8e8; --acc: #ffffff; --mid: #a0a0a0; --dim: #606060;
  --ok: #8fa68b; --info: #8597aa; --warn: #b5a07a; --bad: #bc8888; --crit: #bc8888; --xbg: #bc8888; --xfg: #0a0a0a;
  --mono: 'JetBrains Mono', Consolas, 'Cascadia Mono', 'DejaVu Sans Mono', monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --b0: #f4f4f4; --b1: #ebebeb; --b2: #e2e2e2; --b3: #d4d4d4; --b4: #c6c6c6;
    --fg: #141414; --acc: #000000; --mid: #5e5e5e; --dim: #7a7a7a;
    --ok: #3b5f3c; --info: #3a5470; --warn: #6a521e; --bad: #7e3d3f; --crit: #7e3d3f; --xbg: #7e3d3f; --xfg: #f4f4f4; color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--b0); color: var(--fg); font: 12px/1.5 var(--mono); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--acc); outline-offset: -1px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ------------------------------------------------------------ page frame */
.top { display: flex; flex-wrap: wrap; align-items: stretch; border-bottom: 1px solid var(--b3); min-height: 32px;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.top .name { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-right: 1px solid var(--b3); }
.top .name b { letter-spacing: 1px; }
.top .name span { color: var(--mid); }
.top .grow { flex: 1; }
.top .hint { display: flex; align-items: center; padding: 0 16px; color: var(--mid); }
.themes { display: flex; border-left: 1px solid var(--b3); }
.themes button { padding: 0 12px; min-height: 32px; color: var(--mid); border-right: 1px solid var(--b3); display: flex; align-items: center; gap: 8px; }
.themes button[aria-pressed="true"] { background: var(--acc); color: var(--b0); font-weight: 700; }
.themes i { width: 8px; height: 8px; display: inline-block; border: 1px solid currentColor; }

.layout { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: calc(100% - 33px); }
.tree { border-right: 1px solid var(--b3); padding: 12px 0 24px; position: sticky; top: 0; align-self: start; max-height: 100vh; overflow: auto; }
.tree h2 { font-size: 12px; margin: 14px 16px 6px; color: var(--mid); font-weight: 400; letter-spacing: 1px; text-transform: uppercase; }
.tree h2:first-child { margin-top: 0; }
.tree button { display: flex; width: 100%; text-align: left; padding: 4px 16px 4px 28px; gap: 8px; color: var(--fg); position: relative; }
.tree button::before { content: ""; position: absolute; left: 16px; top: 0; bottom: 0; width: 1px; background: var(--b3); }
.tree button:hover { background: var(--b1); }
.tree button[aria-current="true"] { background: var(--acc); color: var(--b0); font-weight: 700; }
.tree button[aria-current="true"]::before { background: var(--b0); }
.tree .tsel { display: none; }

main { min-width: 0; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 40px 20px; display: flex; flex-direction: column; gap: 20px; }
.stage { background: var(--b1); border: 1px solid var(--b3); position: relative; overflow: hidden; }
.stage .cap { display: flex; justify-content: space-between; gap: 12px; padding: 6px 10px; color: var(--mid); border-bottom: 1px solid var(--b3); flex-wrap: wrap; }
.stage .cap b { color: var(--fg); }
.scalebox { position: relative; }
.scaler { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.dock { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.dock button { border: 1px solid var(--b3); background: var(--b0); padding: 10px 16px; color: var(--fg); }
.dock button:hover { border-color: var(--acc); }

.spec { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid var(--b3); }
.spec > header { grid-column: 1 / -1; padding: 14px 16px; border-bottom: 1px solid var(--b3); display: flex; flex-direction: column; gap: 4px; }
.spec > header h1 { margin: 0; font-size: 14px; text-wrap: balance; }
.spec > header p { margin: 0; color: var(--mid); max-width: 90ch; }
.spec section { padding: 14px 16px; border-right: 1px solid var(--b3); min-width: 0; }
.spec section:last-child { border-right: 0; }
.spec h3 { margin: 0 0 10px; font-size: 12px; font-weight: 400; color: var(--mid); letter-spacing: 1px; text-transform: uppercase; }
.spec ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.spec li { padding-left: 14px; position: relative; overflow-wrap: anywhere; }
.spec li::before { content: ""; position: absolute; left: 0; top: 8px; width: 6px; height: 1px; background: var(--mid); }
.spec kbd { font: inherit; color: var(--acc); }
.spec .keys li { padding-left: 0; display: grid; grid-template-columns: minmax(96px, auto) 1fr; gap: 12px; }
.spec .keys li::before { display: none; }
.spec code { color: var(--acc); }

@media (max-width: 1000px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .tree { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--b3); padding: 10px 16px; }
  .tree h2, .tree button { display: none; }
  .tree .tsel { display: block; width: 100%; background: var(--b1); border: 1px solid var(--b3); padding: 6px 8px; color: var(--fg); border-radius: 0; }
  main { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); }
  .spec { grid-template-columns: minmax(0, 1fr); }
  .spec section { border-right: 0; border-bottom: 1px solid var(--b3); }
  .top .hint { display: none; }
}

/* ======================================================== the window */
.win { width: 1120px; height: 700px; background: var(--b0); color: var(--fg); border: 1px solid var(--b3);
  position: relative; display: flex; flex-direction: column; overflow: hidden; outline: none; user-select: none; }
.win.max { border-color: transparent; }
.win.narrow { width: 640px; }
.win.eph { border-top: 1px solid var(--acc); }
.win .ic { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1; display: block; }
.win .ic.c { shape-rendering: crispEdges; }

/* bar */
.bar { height: 33px; flex: 0 0 33px; display: flex; align-items: stretch; border-bottom: 1px solid var(--b3); position: relative; background: var(--b0); }
.bar > * { flex-shrink: 0; }
.bar .drag { flex: 1 1 0; min-width: 16px; }
.cells { display: flex; align-items: stretch; }
.cell { height: 32px; min-width: 32px; padding: 0 11px; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--fg);
  transition: background-color 80ms linear, color 80ms linear; white-space: nowrap; }
.cell:hover { background: var(--b1); }
.cell[disabled] { color: var(--dim); cursor: default; }
.cell[disabled]:hover { background: none; }
.cell.on { background: var(--b2); }
.cell.mute { color: var(--mid); }
.rule { width: 1px; background: var(--b3); flex: 0 0 1px; }
.eph-tag { background: var(--acc); color: var(--b0); font-weight: 700; padding: 0 10px; display: flex; align-items: center; }

.tab { position: relative; height: 32px; padding: 0 11px; display: flex; align-items: center; gap: 6px; color: var(--mid); border-right: 1px solid var(--b3);
  transition: background-color 80ms linear, color 80ms linear; white-space: nowrap; }
.tab:hover { background: var(--b1); }
.tab.on { background: var(--acc); color: var(--b0); font-weight: 700; }
.win.blur .tab.on { background: var(--b3); color: var(--fg); }
.tab.pin { background: var(--b2); color: var(--fg); }
.tab.pin.on { background: var(--acc); color: var(--b0); }
.tab.trim { color: var(--dim); }
.tab.crash { color: var(--bad); text-decoration: line-through; }
.tab .ld { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--mid); }
.tab.on .ld { background: var(--b0); opacity: .5; }
.tab .x { display: none; margin-right: -4px; padding: 2px; }
.tab:hover .x, .tab.on .x { display: block; }
.tab.pin .x { display: none !important; }
.tab .x:hover { background: var(--b3); color: var(--fg); }
.tab.on .x:hover { background: var(--b0); color: var(--acc); }
.tab.drop-l::before { content: ""; position: absolute; left: -1px; top: 0; bottom: 0; width: 2px; background: var(--acc); }
.tab.dragging { outline: 1px solid var(--acc); outline-offset: -1px; background: transparent !important; color: var(--mid) !important; }
.tab .snd { display: block; }
.tab .snd:hover { color: var(--fg); }

/* the address group gives up width first, so window controls never leave the bar */
.center { display: flex; align-items: stretch; flex: 0 1 600px; min-width: 260px; border-left: 1px solid var(--b3); border-right: 1px solid var(--b3); }
.win.narrow .center { flex-basis: 300px; min-width: 200px; }
.addr { flex: 1; min-width: 0; display: flex; align-items: stretch; position: relative; }
.addr.focus { background: var(--b2); outline: 1px solid var(--acc); outline-offset: -1px; }
.win.blur .addr.focus { outline-color: var(--mid); }
.sec { padding: 0 10px 0 12px; display: flex; align-items: center; color: var(--mid); }
.sec:hover { background: var(--b1); color: var(--fg); }
.sec.http { color: var(--warn); }
.sec.brx { color: var(--acc); }
.sec.blk { color: var(--bad); }
.url { flex: 1; min-width: 0; text-align: left; display: flex; align-items: center; overflow: hidden; white-space: nowrap; padding-right: 12px; cursor: text; }
.url b { color: var(--fg); font-weight: 700; }
.url span { color: var(--mid); overflow: hidden; text-overflow: ellipsis; }
.url .plh { color: var(--mid); }
.addr input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 0 12px 0 0; }
.addr .gt { padding: 0 10px 0 12px; display: flex; align-items: center; color: var(--acc); }
.addr .bell { padding: 0 8px; display: flex; align-items: center; color: var(--mid); }

.wc { display: flex; border-left: 1px solid var(--b3); }
.wc button { width: 46px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--fg); transition: background-color 80ms linear, color 80ms linear; }
.wc button:hover { background: var(--b2); }
.wc button.close:hover { background: var(--xbg); color: var(--xfg); }
.win.blur .wc button { color: var(--mid); }
.progress { position: absolute; left: 0; bottom: -1px; height: 1px; background: var(--acc); }
.win.blur .progress { background: var(--mid); }
.hotzone { position: absolute; left: 0; right: 0; top: 0; height: 6px; z-index: 30; }
.win.fs .bar { position: absolute; left: 0; right: 0; top: 0; z-index: 25; }

/* strips that tile under the bar */
.strip { display: flex; align-items: center; gap: 12px; padding: 0 12px; height: 29px; border-bottom: 1px solid var(--b3); flex: 0 0 auto; white-space: nowrap; }
.strip .tag { width: 44px; text-align: center; color: var(--mid); }
.strip .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.strip .note { color: var(--mid); }
.strip.sel { background: var(--b2); }
.strip.sel .tag { background: var(--acc); color: var(--b0); font-weight: 700; }
.strip.hov:hover { background: var(--b1); cursor: pointer; }
.strip.sel.hov:hover { background: var(--b2); }
.strip s { color: var(--mid); }
.strip .acc { color: var(--acc); }
.btn { border: 1px solid var(--b3); padding: 2px 10px; color: var(--fg); }
.btn:hover { border-color: var(--mid); background: var(--b1); }
.btn.pri { background: var(--acc); color: var(--b0); border-color: var(--acc); font-weight: 700; }
.btn.pri:hover { background: var(--fg); }

.body { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
.row { flex: 1; display: flex; min-height: 0; }
.pagecol { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
.page { flex: 1; min-height: 0; overflow: hidden; position: relative; }
.foot { height: 25px; flex: 0 0 25px; border-top: 1px solid var(--b3); display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 12px; color: var(--mid); white-space: nowrap; overflow: hidden; }
.foot span:first-child { overflow: hidden; text-overflow: ellipsis; }

/* find bar */
.find { height: 29px; flex: 0 0 29px; border-top: 1px solid var(--b3); display: flex; align-items: stretch; background: var(--b0); }
.find label { padding: 0 12px; display: flex; align-items: center; color: var(--mid); }
.find input { flex: 1; min-width: 0; border: 0; outline: 0; background: var(--b2); padding: 0 10px; }
.find .cnt { padding: 0 12px; display: flex; align-items: center; color: var(--mid); min-width: 64px; justify-content: center; }
.find .cnt.none { color: var(--bad); }
.find .cell { height: 28px; border-left: 1px solid var(--b3); }

/* panels (tile right) */
.panel { width: 361px; flex: 0 0 361px; border-left: 1px solid var(--b3); display: flex; flex-direction: column; background: var(--b0); min-height: 0; }
.ph { height: 32px; flex: 0 0 32px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid var(--b3); }
.ph b { letter-spacing: 1px; }
.seg { display: flex; border: 1px solid var(--b3); height: 20px; }
.seg button { padding: 0 8px; color: var(--mid); display: flex; align-items: center; }
.seg button:hover { background: var(--b1); color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--acc); color: var(--b0); }
.seg.warn button[aria-pressed="true"] { background: var(--warn); color: var(--b0); }
.pbody { padding: 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--b3); }
.prow { display: flex; align-items: center; gap: 10px; min-height: 18px; }
.prow .k { width: 18px; height: 18px; background: var(--mid); color: var(--b0); font-weight: 700; display: flex; align-items: center; justify-content: center; flex: 0 0 18px; }
.prow .g { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .n { color: var(--acc); font-weight: 700; }
.muted { color: var(--mid); }
.log { flex: 1; min-height: 0; overflow: hidden; padding: 0 12px; display: flex; flex-direction: column; gap: 9px; }
.log div { display: flex; gap: 10px; white-space: nowrap; }
.log div span:first-child { width: 18px; color: var(--mid); flex: 0 0 18px; }
.log div span:last-child { overflow: hidden; text-overflow: ellipsis; }
.pfoot { height: 28px; flex: 0 0 28px; border-top: 1px solid var(--b3); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; color: var(--mid); }
.pfoot button:hover { color: var(--fg); }
.dl { padding: 10px 12px; border-bottom: 1px solid var(--b3); display: flex; flex-direction: column; gap: 6px; }
.dl .top2 { display: flex; justify-content: space-between; gap: 10px; }
.dl .top2 b { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dl .bar1 { height: 1px; background: var(--b3); }
.dl .bar1 i { display: block; height: 1px; background: var(--acc); }
.dl .acts { display: flex; gap: 14px; color: var(--mid); }
.dl .acts button:hover { color: var(--fg); }
.dl.fail .st { color: var(--bad); }

/* internal pages */
.ipage { position: absolute; inset: 0; background: var(--b0); display: flex; flex-direction: column; }
.iend { margin-top: auto; padding: 16px 24px 24px; border-top: 1px solid var(--b3); display: flex; flex-direction: column; gap: 10px; }
.iend .t { font-weight: 700; }
.iend .acts { display: flex; gap: 8px; margin-top: 6px; }
.keymap { margin-top: auto; padding: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 200px)); gap: 24px; }
.keymap div { border-top: 1px solid var(--b3); padding-top: 12px; display: grid; grid-template-columns: 96px 1fr; row-gap: 8px; }
.keymap .k { color: var(--acc); }
.keymap h4 { grid-column: 1 / -1; margin: 0; font-weight: 400; color: var(--mid); }
.keymap button { text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.keymap button:hover { color: var(--acc); }
.hist { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.hist .hs { display: flex; align-items: stretch; height: 32px; border-bottom: 1px solid var(--b3); }
.hist .hs input { flex: 1; border: 0; outline: 0; background: transparent; padding: 0 12px; }
.hist .hs .cell { border-left: 1px solid var(--b3); color: var(--mid); }
.hist .day { padding: 14px 24px 6px; color: var(--mid); }
.hist .hr { display: grid; grid-template-columns: 56px minmax(0, 1fr) 200px 28px; gap: 12px; padding: 0 24px; height: 26px; align-items: center; }
.hist .hr:hover { background: var(--b1); }
.hist .hr .ti { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist .hr .ho { color: var(--mid); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist .hr .del { visibility: hidden; color: var(--mid); }
.hist .hr:hover .del { visibility: visible; }
.hist .hr .del:hover { color: var(--fg); }
.hist .list { overflow: hidden; flex: 1; }
.set { display: flex; flex: 1; min-height: 0; }
.set nav { width: 180px; border-right: 1px solid var(--b3); display: flex; flex-direction: column; padding: 12px 0; }
.set nav button { text-align: left; padding: 6px 16px; color: var(--mid); }
.set nav button:hover { color: var(--fg); background: var(--b1); }
.set nav button[aria-current="true"] { color: var(--b0); background: var(--acc); font-weight: 700; }
.set .sc { flex: 1; padding: 20px 28px; display: flex; flex-direction: column; gap: 0; overflow: hidden; }
.set .sc h4 { margin: 0 0 12px; font-size: 12px; letter-spacing: 1px; }
.set .sr { display: grid; grid-template-columns: 220px 1fr; gap: 16px; padding: 10px 0; border-top: 1px solid var(--b3); align-items: center; }
.set .sr .d { color: var(--mid); grid-column: 2; margin-top: -8px; }
.set .sw { display: flex; gap: 0; border: 1px solid var(--b3); width: max-content; }
.set .sw button { padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; border-right: 1px solid var(--b3); }
.set .sw button:last-child { border-right: 0; }
.set .sw button[aria-pressed="true"] { outline: 1px solid var(--acc); outline-offset: -1px; }
.set .sw span { display: flex; }
.set .sw i { width: 14px; height: 14px; display: block; }
.set .tin { border: 1px solid var(--b3); background: var(--b1); padding: 4px 8px; outline: 0; width: 100%; max-width: 420px; }
.set .tin:focus { border-color: var(--acc); }
.set textarea.tin { font: inherit; color: inherit; height: 96px; resize: none; display: block; }

/* semantic tones: muted colour as text over a ~22% tint of itself.
   They say allowed / asking / paused / refused at a glance and never
   out-shout the accent, which stays reserved for focus and selection. */
.t-ok { --tone: var(--ok); } .t-info { --tone: var(--info); } .t-warn { --tone: var(--warn); } .t-bad { --tone: var(--bad); }
.seg button[aria-pressed="true"][class*="t-"] { background: color-mix(in srgb, var(--tone) 22%, var(--b0)); color: var(--tone); }
.seg button[class*="t-"]:not([aria-pressed="true"]):hover { color: var(--tone); }
.btn[class*="t-"] { color: var(--tone); border-color: color-mix(in srgb, var(--tone) 45%, var(--b3)); }
.btn[class*="t-"]:hover { background: color-mix(in srgb, var(--tone) 18%, var(--b0)); border-color: var(--tone); }
.btn.fill[class*="t-"] { background: color-mix(in srgb, var(--tone) 22%, var(--b0)); }
.chip { display: inline-flex; align-items: center; padding: 0 6px; height: 18px; color: var(--tone); background: color-mix(in srgb, var(--tone) 20%, var(--b0)); }
.toast[class*="t-"] { border-color: var(--tone); }
.toast[class*="t-"] span:first-child { color: var(--tone); }
.prow .k[class*="t-"] { background: color-mix(in srgb, var(--tone) 26%, var(--b0)); color: var(--tone); }
.log div span.k[class*="t-"] { color: var(--tone); }
.tones { display: grid; grid-template-columns: 120px repeat(4, minmax(0, 1fr)); border: 1px solid var(--b3); margin-top: 4px; }
.tones > * { padding: 6px 10px; border-right: 1px solid var(--b3); border-bottom: 1px solid var(--b3); display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; }
.tones i { width: 10px; height: 10px; display: block; flex: 0 0 10px; }

/* the web (sites own their look) */
.site { position: absolute; inset: 0; background: #ffffff; color: #1d1d1f; font: 15px/1.6 Georgia, 'Times New Roman', serif; padding: 36px 64px; overflow: hidden; user-select: text; }
.site .kick { font: 12px/1.4 system-ui, sans-serif; color: #6b6b6b; text-transform: uppercase; letter-spacing: 1px; }
.site h1 { font: 700 30px/1.2 Georgia, serif; margin: 8px 0 18px; max-width: 26ch; }
.site p { max-width: 62ch; margin: 0 0 14px; }
.site a { color: #0b57d0; text-decoration: underline; }
.site mark { background: #ffe58a; color: inherit; }
.site mark.cur { background: #ff9d3c; }
.site .sk { height: 12px; background: #eeeeee; margin: 10px 0; max-width: 62ch; }
.site.dark { background: #16181d; color: #d7dae0; }
.site.dark .kick { color: #9097a3; }
.site.dark a { color: #8ab4f8; }

/* floating, transient: owned popup windows in the real build */

var GROUPS = { system: 'system', window: 'window', tabs: 'tabs', address: 'address bar', page: 'page', shield: 'shield', surfaces: 'panels & pages', errors: 'errors' };

function renderTree() {
  var tree = document.getElementById('tree'), html = '', last = '';
  html += '<label for="tsel" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">State</label><select class="tsel" id="tsel">' + NODES.map(function (n) { return '<option value="' + n.id + '"' + (n.id === current ? ' selected' : '') + '>' + GROUPS[n.g] + ' / ' + n.label + '</option>'; }).join('') + '</select>';
  NODES.forEach(function (n) {
    if (n.g !== last) { html += '<h2>' + GROUPS[n.g] + '</h2>'; last = n.g; }
    html += '<button type="button" data-node="' + n.id + '" aria-current="' + (n.id === current) + '">' + n.label + '</button>';
  });
  tree.innerHTML = html;
}
function renderSpec(n) {
  document.getElementById('capname').textContent = GROUPS[n.g] + ' / ' + n.label;
  var spec = document.getElementById('spec');
  spec.innerHTML = '<header><h1>' + esc(n.label) + '</h1><p>' + n.what + '</p>' + (n.extra ? n.extra() : '') + '</header>' +
    '<section><h3>how it works</h3><ul>' + n.how.map(function (h) { return '<li>' + h + '</li>'; }).join('') + '</ul></section>' +
    '<section><h3>keys</h3><ul class="keys">' + (n.keys.length ? n.keys.map(function (k) { return '<li><kbd>' + esc(k[0]) + '</kbd><span>' + esc(k[1]) + '</span></li>'; }).join('') : '<li><span class="muted">none specific to this state</span><span></span></li>') + '</ul></section>' +
    '<section><h3>build notes</h3><ul>' + n.build.map(function (b) { return '<li>' + b + '</li>'; }).join('') + '</ul></section>';
}
function select(id, push) {
  var n = NODES.filter(function (x) { return x.id === id; })[0] || NODES[0];
  current = n.id;
  clearTimeout(toastTimer);
  S = fresh();
  n.apply();
  renderTree(); renderSpec(n); render();
  if (push !== false && location.hash !== '#' + n.id) { try { history.replaceState(null, '', '#' + n.id); } catch (e) { location.hash = n.id; } }
}
document.getElementById('tree').addEventListener('click', function (ev) { var b = ev.target.closest('[data-node]'); if (b) select(b.dataset.node); });
document.getElementById('tree').addEventListener('change', function (ev) { if (ev.target.id === 'tsel') select(ev.target.value); });
window.addEventListener('hashchange', function () { var id = location.hash.slice(1); if (id && id !== current) select(id, false); });

applyTheme();
select((location.hash || '#titlebar').slice(1), false);
})();
